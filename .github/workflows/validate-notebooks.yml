name: Validate notebooks

on:
  push:
    paths:
      - "**/*.ipynb"
      - ".github/scripts/validate_notebooks.py"
      - ".github/workflows/validate-notebooks.yml"
  pull_request:
    paths:
      - "**/*.ipynb"
      - ".github/scripts/validate_notebooks.py"
      - ".github/workflows/validate-notebooks.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install nbformat
      - run: python .github/scripts/validate_notebooks.py
